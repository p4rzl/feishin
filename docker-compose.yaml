services:
    feishin:
        container_name: feishin
        image: 'ghcr.io/p4rzl/feishin:${FEISHIN_TAG:-development}'
        restart: unless-stopped
        environment:
            SERVER_NAME: 'Plex'
            SERVER_LOCK: 'true'
            SERVER_TYPE: 'plex'
            SERVER_URL: '${FEISHIN_URL:?Set FEISHIN_URL in .env to the browser-visible Feishin origin}/plex'
            PLEX_PROXY_URL: '${PLEX_URL:?Set PLEX_URL in .env to the container-reachable Plex origin}'
            REMOTE_URL: ''
            ANALYTICS_DISABLED: 'true'
            FS_PLAYBACK_SCROBBLE_ENABLED: 'true'
        ports:
            - '${FEISHIN_PORT:-9180}:9180'
